<!DOCTYPE html>
<html>
<head>
    <title>Text Result</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
        }

        .header {
            background: #17365d;
            color: white;
            padding: 20px;
            font-size: 24px;
            font-weight: bold;
        }

        .container {
            width: 70%;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
        }

        h1 {
            color: #17365d;
        }

        .label {
            display: inline-block;
            background: #2878e8;
            color: white;
            padding: 10px 25px;
            margin: 10px;
            border-radius: 5px;
            font-weight: bold;
        }

        .text-data {
            background: #f4f6f9;
            padding: 15px;
            margin: 20px 0;
            border-radius: 5px;
        }

        button {
            background: #2878e8;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="header">
    Data Annotation and Labeling Tool
</div>

<div class="container">

    <h1>Text Analysis Result</h1>

    <h2>Entered Text</h2>

    <div class="text-data">
        {{ text }}
    </div>

    <h2>AI Detected Label</h2>

    <span class="label">{{ label }}</span>

    <br><br>

    <a href="/upload">
        <button>Upload Another Text</button>
    </a>

</div>

</body>
</html>
